<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f0ebf8">
<title>Student Quiz</title><link rel="stylesheet" href="style.css?v=english1">
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script></head>
<body><main class="page-shell">
<header class="form-header"><div class="header-mark" aria-hidden="true">✓</div><p class="eyebrow">STUDENT FORM</p><h1 id="quiz-title">Student quiz</h1><p id="quiz-validity" class="subtitle">Enter your details and answer all 10 questions.</p></header>
<section id="unavailable" class="form-card hidden" aria-live="polite"><h2>Quiz not available</h2><p>The teacher has not saved the 10 questions yet.</p></section>
<form id="student-form" class="form-card hidden">
<div class="required-note"><span>*</span> Required</div>
<label class="field-label" for="nama">Full name <span>*</span></label><input id="nama" name="nama" type="text" maxlength="120" autocomplete="name" placeholder="Enter your full name" required>
<label class="field-label" for="student-id">Student ID <span>*</span></label><input id="student-id" name="id" type="text" maxlength="40" autocomplete="off" placeholder="Enter your student ID" required>
<label class="field-label" for="student-group">Group <span>*</span></label><input id="student-group" name="group" type="text" maxlength="80" autocomplete="off" placeholder="Enter your group" required>
<div id="questions"></div><p id="status" class="status" role="status" aria-live="polite"></p>
<button id="submit-button" type="submit">Submit all answers <span aria-hidden="true">→</span></button>
<p class="privacy-note">Each student ID can submit only once. Your submission is recorded on the quiz server.</p>
</form><footer>Thank you for completing the quiz.</footer></main><script src="app.js?v=quiz-window1"></script></body></html>
